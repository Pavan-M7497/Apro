<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Runs before any CSS or JS so dark-mode users never see a white flash.
         Must stay in sync with the same rule in src/contexts/ThemeMode.tsx. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('aevon-theme');
          var d = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <title>Aevon — The record of your aquatics career</title>
    <meta name="description" content="Profiles for Indian swimmers, water polo players, and divers. Your times, meets, and film in one place — for coaches, selectors, and sponsors." />

    <link rel="manifest" href="/manifest.json" />
